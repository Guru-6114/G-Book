name: gbook
description: Digital Ledger & Accounts App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # HTTP
  http: ^1.2.1

  # Local storage
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Formatting
  intl: ^0.19.0

  # Firebase — run: flutterfire configure to generate firebase_options.dart
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Local notifications (shows FCM messages when app is in foreground)
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    # Note: create these folders if they don't exist:
    # mkdir gbook_flutter/assets/images
    # mkdir gbook_flutter/assets/icons