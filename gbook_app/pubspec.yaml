name: gbook_app
description: Digital Ledger & Accounts App
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.1
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  intl: ^0.20.2          # ← was ^0.19.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.2
  path_provider: ^2.1.4
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  open_file: ^4.0.0
  image_picker: ^1.2.2
  flutter_contacts: ^1.1.9+2 
  flutter_tts: ^4.2.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/